name: Publish Android update
on:
  push:
    branches: [main]
    paths: ['.channel/release-request.json']
permissions:
  contents: write
concurrency:
  group: svitlo-public-updates
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch the short-lived APK artifact
        run: python3 scripts/fetch-artifact.py
      - name: Include notices for bundled Android components
        run: cp THIRD_PARTY_NOTICES.txt artifact/THIRD_PARTY_NOTICES.txt
      - name: Verify and publish the signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-release.mjs
      - name: Publish the update manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json certificate.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Android update manifest'
            git push origin HEAD:main
          fi
