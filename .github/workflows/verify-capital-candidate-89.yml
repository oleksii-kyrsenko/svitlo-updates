name: Native candidate89 retention, UI and live schedule acceptance
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Acceptance suite
        type: choice
        options: [all, live]
        default: all
        required: false
  push:
    branches: [feature/capital-coverage-90]
    paths: ['.github/qa/native89/**', '.github/workflows/verify-capital-candidate-89.yml']
permissions:
  contents: read
jobs:
  native:
    if: inputs.suite != 'live'
    name: Android API${{ matrix.api }} saved${{ matrix.theme }} 88to89
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        api: [30, 35, 36]
        theme: [aurora, moss]
    env:
      SAVED_THEME: ${{ matrix.theme }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install pillow==12.0.0
      - name: Verify pinned APKs and independent native QA contracts
        run: |
          if [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;36.0.0'
          fi
          python3 .github/qa/native89/test-contract.py
          python3 .github/qa/native89/contract.py
      - name: Enable runner acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          cores: 2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -gpu swiftshader
          script: python3 .github/qa/native89/prepare-emulator.py && python3 -u .github/qa/native89/theme-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate89-native-api${{ matrix.api }}-${{ matrix.theme }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: apk-diagnostics/
          retention-days: 90

  live:
    if: startsWith(github.ref, 'refs/heads/fix/popivka-schedule')
    name: Live schedule Android API${{ matrix.api }} 88to89
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        api: [30, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify independent source and binary contracts
        run: |
          if [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;36.0.0'
          fi
          python3 .github/qa/popivka/test-source.py
          python3 .github/qa/popivka/test-screen.py
          python3 .github/qa/native89/test-contract.py
          python3 .github/qa/native89/contract.py
      - name: Enable runner acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          cores: 2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -gpu swiftshader
          script: python3 .github/qa/native89/prepare-emulator.py && python3 -u .github/qa/popivka/schedule-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: popivka-live-api${{ matrix.api }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: apk-diagnostics/
          retention-days: 90
