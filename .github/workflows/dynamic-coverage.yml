name: Dynamic coverage data and source monitor
on:
  workflow_call:
    inputs:
      collection_mode:
        type: string
        default: capital
    secrets:
      DYNAMIC_COVERAGE_SIGNING_KEY:
        required: true
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      collection_mode:
        type: choice
        options: [capital, legacy]
        default: capital
permissions:
  contents: write
  issues: write
concurrency:
  group: dynamic-coverage-publisher
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded public PDF reader
        run: pip install pdfplumber==0.11.9 cryptography==50.0.0
      - uses: actions/cache@v4
        with:
          path: coverage/geography-cache.json
          key: geography-${{ hashFiles('coverage/geography.py') }}-${{ github.run_id }}
          restore-keys: geography-${{ hashFiles('coverage/geography.py') }}-
      - name: Restore sourced geography bootstrap on a cold cache
        run: |
          if [ ! -f coverage/geography-cache.json ]; then cp coverage/geography-bootstrap.json coverage/geography-cache.json; fi
      - name: Validate publisher and monitor
        run: |
          node --test coverage/qa/*.test.mjs
          python3 coverage/qa/test-monitor.py
          python3 coverage/qa/test-crawl.py
          python3 coverage/test_geography.py
          python3 coverage/qa/test-capital-geography.py
          python3 -m unittest discover -s coverage/qa -p 'test_capital*.py'
          python3 coverage/qa/test_city_crawl.py
          python3 coverage/qa/test-official-rosters.py
          python3 coverage/qa/test-city-forms.py
          python3 coverage/qa/test-official-bulk.py
          python3 coverage/qa/test-cherkasy-documents.py
          python3 coverage/qa/test-vinnytsia-documents.py
          python3 coverage/qa/test-western-official.py
          python3 coverage/qa/test-cherkasy-tls.py
          python3 coverage/qa/test-remainder.py
          python3 coverage/qa/test-batches.py
      - name: Monitor every operator and discover registry changes
        run: python3 coverage/monitor.py --registry
      - name: Schedule seven bounded capital coverage roles
        run: python3 coverage/capitals/workqueue.py --state coverage/capitals/work-state.json --output coverage/capitals/workqueue.json
      - name: Maintain one investigation task
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 coverage/report-issue.py
      - name: Persist source health independently of signing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coverage/report.json coverage/capitals/work-state.json coverage/capitals/workqueue.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh operator source health'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Load signing key from secret
        env:
          COVERAGE_SIGNING_KEY: ${{ secrets.DYNAMIC_COVERAGE_SIGNING_KEY }}
        run: |
          if [ -z "$COVERAGE_SIGNING_KEY" ]; then
            echo 'Signing key unavailable. Collection report remains available; signed data will not be replaced.'
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/coverage-signing.pem"
          printf '%s\n' "$COVERAGE_SIGNING_KEY" > "$key_file"
          echo "DYNAMIC_COVERAGE_KEY_FILE=$key_file" >> "$GITHUB_ENV"
      - name: Collect and sign compatible public data
        env:
          COVERAGE_STREET_BUDGET: ${{ vars.COVERAGE_STREET_BUDGET || '8' }}
          COVERAGE_ADDRESS_BUDGET: ${{ vars.COVERAGE_ADDRESS_BUDGET || '20' }}
          COVERAGE_COLLECTION_MODE: ${{ inputs.collection_mode || 'capital' }}
          COVERAGE_CITY_REQUEST_LIMIT: ${{ vars.COVERAGE_CITY_REQUEST_LIMIT || '400' }}
          COVERAGE_OPERATORS: ${{ vars.COVERAGE_OPERATORS }}
          SVITLO_GEOGRAPHY_CACHE: coverage/geography-cache.json
        run: |
          node coverage/refresh.mjs
          node coverage/verify.mjs
          node coverage/verify-v2.mjs
      - name: Publish complete data packages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dynamic-coverage coverage/report.json coverage/refresh-report.json coverage/crawl-state.json
          files=(coverage/cursors/*.json)
          if [ -e "${files[0]}" ]; then git add "${files[@]}"; fi
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh signed coverage and source health'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Add current collection gaps to the investigation task
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 coverage/report-issue.py
      - name: Persist bounded crawl cursor even after failed collection
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coverage/crawl-state.json
          files=(coverage/cursors/*.json)
          if [ -e "${files[0]}" ]; then git add "${files[@]}"; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Advance resumable official source crawl cursor'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-coverage-${{ github.run_id }}
          path: |
            coverage/report.json
            coverage/capitals/work-state.json
            coverage/capitals/workqueue.json
            coverage/refresh-report.json
            coverage/crawl-state.json
            coverage/staging/*.report.json
            coverage/cursors/*.json
          retention-days: 30
      - name: Remove ephemeral key
        if: always()
        run: rm -f "$RUNNER_TEMP/coverage-signing.pem"
