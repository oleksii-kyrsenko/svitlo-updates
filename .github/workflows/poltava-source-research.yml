name: Poltava source availability research
on:
  push:
    branches: [feature/poltava-dynamic-sources]
    paths: ['.github/workflows/poltava-source-research.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch linked current operator document
        run: |
          mkdir -p research-output
          python - <<'PYCODE'
          import urllib.request,json,pathlib,concurrent.futures,hashlib
          urls=['https://www.poe.pl.ua/wp-content/uploads/2026/09/HPV_26_27-sajt.pdf','https://poe.pl.ua/wp-content/uploads/2026/09/HPV_26_27-sajt.pdf','https://www.poe.pl.ua/disconnection/hrafik-pohodynnoho-vidkliuchennia-elektroenerhii/']
          root=pathlib.Path('research-output')
          def probe(url):
            result={'url':url}
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=40) as r:
                body=r.read(16000001)
                if len(body)>16000000:raise ValueError('size limit')
                suffix='.pdf' if body.startswith(b'%PDF-') else '.html'
                name=hashlib.sha256(url.encode()).hexdigest()[:12]+suffix
                (root/name).write_bytes(body)
                result.update(status=r.status,mime=r.headers.get_content_type(),bytes=len(body),sha256=hashlib.sha256(body).hexdigest(),file=name)
            except Exception as e:result['error']=str(e)
            return result
          rows=list(concurrent.futures.ThreadPoolExecutor(max_workers=3).map(probe,urls))
          (root/'result.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False))
          print(json.dumps(rows,ensure_ascii=False))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: poltava-source-research-${{ github.run_id }}
          path: research-output
          retention-days: 3
